name: Validar paquete APM

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar APM
        # Misma versión que se usa localmente; actualizarla a la vez que la local.
        run: pip install apm-cli==0.35.0

      - name: Validar primitivas
        run: apm compile --validate

      - name: Convenciones de los agentes
        run: python3 scripts/check-agents.py

      - name: Instalar en los 4 targets sin avisos
        run: |
          apm install 2>&1 | tee install.log
          # El aviso de política de organización (.github-private) no aplica a este repo.
          if grep -v "policy" install.log | grep -E '\[!\]|\[x\]'; then
            echo "::error::apm install mostró avisos o errores"
            exit 1
          fi

      - name: Auditar archivos desplegados
        run: apm audit

      - name: Los archivos generados están en .gitignore
        run: |
          rm -f install.log
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::apm install generó archivos que no están en .gitignore"
            exit 1
          fi
